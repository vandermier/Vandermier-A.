<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-right: 95px;
            white-space: nowrap;
        }

        .wallet-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-balance {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .store-card {
            background: #000;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .store-card:hover {
            border-color: var(--accent);
        }

        .item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #111;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.3;
            height: 28px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .item-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-price {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: #ffd700;
        }

        .btn-buy {
            width: 100%;
            padding: 8px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .btn-buy:hover {
            opacity: 0.85;
        }

        /* Modal ดีไซน์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">กลับหน้าหลัก</a>
            <h1 class="app-title">Store</h1>
        </div>

        <div class="wallet-box">
            <span class="wallet-label">ยอดเงินคงเหลือของคุณ</span>
            <span class="wallet-balance" id="userSilverBalance">0 Silver</span>
        </div>

        <div class="section-box">
            <h3 class="box-title">ร้านค้า</h3>
            <div class="store-grid" id="storeItemsContainer">
                <p style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดรายการสินค้า...</p>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let currentUser = null;
        let userData = null;
        let storeItemsList = [];

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function initAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            let { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
            if (!data) {
                window.location.href = 'profile.html';
                return;
            }
            userData = data;
            updateWalletDisplay();
            fetchStoreItems();
        }

        function updateWalletDisplay() {
            // ใช้ .toLocaleString() เพื่อจัดรูปแบบตัวเลขยอดเงินให้มีจุลภาคคั่นตามหลักสากล
            document.getElementById('userSilverBalance').innerText = `${Number(userData.silver || 0).toLocaleString()} Silver`;
        }

        async function fetchStoreItems() {
            const { data, error } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('storeItemsContainer');

            if (error) {
                container.innerHTML = `<p style="grid-column: span 2; text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดสินค้าได้</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีสินค้าในร้านค้า</p>`;
                return;
            }

            storeItemsList = data;

            container.innerHTML = data.map(item => `
                <div class="store-card">
                    <div>
                        <img src="${item.image_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=Item'}" class="item-img" alt="Item">
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.description || 'ไม่มีรายละเอียด'}</div>
                    </div>
                    <div class="item-footer">
                        <!-- ใช้ .toLocaleString() เพื่อจัดรูปแบบราคาสินค้าให้มีจุลภาคคั่นตามหลักสากล -->
                        <div class="item-price">${Number(item.price).toLocaleString()} Silver</div>
                        <button class="btn-buy" onclick="buyItem('${item.id}')">ซื้อสินค้า</button>
                    </div>
                </div>
            `).join('');
        }

        window.buyItem = async function(itemId) {
            const item = storeItemsList.find(i => i.id === itemId);
            if (!item) return;

            const price = Number(item.price);
            const currentSilver = Number(userData.silver || 0);

            if (currentSilver < price) {
                showModal('เงินไม่พอ', 'ยอดเงิน Silver ในบัญชีของคุณไม่เพียงพอสำหรับซื้อสินค้านี้');
                return;
            }

            // 1. หักเงินผู้ซื้อ
            const newSilver = currentSilver - price;
            const { error: updateError } = await supabase
                .from('profiles')
                .update({ silver: newSilver })
                .eq('id', currentUser.id);

            if (updateError) {
                showModal('ข้อผิดพลาด', updateError.message);
                return;
            }

            userData.silver = newSilver;
            updateWalletDisplay();

            // 2. ตรวจสอบว่ามีไอเท็มนี้ใน inventory หรือยัง (ถ้ารวมอยู่แล้ว ให้บวก quantity เพิ่มขึ้น 1)
            const { data: existingInv } = await supabase
                .from('inventory')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('item_name', item.name)
                .maybeSingle();

            if (existingInv) {
                await supabase
                    .from('inventory')
                    .update({ quantity: Number(existingInv.quantity) + 1 })
                    .eq('id', existingInv.id);
            } else {
                await supabase
                    .from('inventory')
                    .insert([{
                        user_id: currentUser.id,
                        item_name: item.name,
                        image_url: item.image_url,
                        description: item.description,
                        quantity: 1
                    }]);
            }

            showModal('ซื้อสำเร็จ', `คุณได้ซื้อ "${item.name}" เรียบร้อยแล้ว ไอเท็มถูกเก็บไว้ในคลัง (Inventory) ของคุณ`);
        }

        initAuth();
    </script>
</body>
</html>
