<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-right: 95px;
            white-space: nowrap;
        }

        .wallet-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-balance {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .store-row-card {
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .store-row-card:hover {
            border-color: var(--accent);
        }

        .item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #111;
            flex-shrink: 0;
        }

        .item-details {
            flex-grow: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-effect {
            font-size: 11px;
            color: #4ade80;
            margin-bottom: 2px;
        }

        .item-price {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #ffd700;
        }

        .btn-buy {
            padding: 8px 14px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            transition: opacity 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-buy:hover {
            opacity: 0.85;
        }

        /* Modal ดีไซน์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">กลับหน้าหลัก</a>
            <h1 class="app-title">Store</h1>
        </div>

        <div class="wallet-box">
            <span class="wallet-label">ยอดเงินคงเหลือของคุณ</span>
            <span class="wallet-balance" id="userSilverBalance">0 Silver</span>
        </div>

        <div class="section-box">
            <h3 class="box-title">ร้านค้า</h3>
            <div class="store-list" id="storeItemsContainer">
                <p style="text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดรายการสินค้า...</p>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let currentUser = null;

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function initAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            await updateWalletDisplay();
            fetchStoreItems();
        }

        async function updateWalletDisplay() {
            const { data } = await supabase.from('profiles').select('silver').eq('id', currentUser.id).maybeSingle();
            if (data) {
                document.getElementById('userSilverBalance').innerText = `${Number(data.silver || 0).toLocaleString()} Silver`;
            }
        }

        async function fetchStoreItems() {
            const { data, error } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('storeItemsContainer');

            if (error) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดสินค้าได้</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีสินค้าในร้านค้า</p>`;
                return;
            }

            container.innerHTML = data.map(item => {
                let effectText = 'ไม่มีผลฟื้นฟู';
                if (item.effect_type === 'energy') effectText = `ฟื้นฟูพลังงาน +${item.effect_value}`;
                else if (item.effect_type === 'hp') effectText = `ฟื้นฟู HP +${item.effect_value}`;
                else if (item.effect_type === 'food') effectText = `ฟื้นฟูอาหาร +${item.effect_value}`;

                return `
                    <div class="store-row-card">
                        <img src="${item.image_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=Item'}" class="item-img" alt="Item">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-effect">${effectText}</div>
                            <div class="item-price">${Number(item.price).toLocaleString()} Silver</div>
                        </div>
                        <button class="btn-buy" onclick="buyItem('${item.id}', this)">ซื้อสินค้า</button>
                    </div>
                `;
            }).join('');
        }

        window.buyItem = async function(itemId, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = 'กำลังซื้อ...';

            // เรียกใช้งาน RPC ฟังก์ชัน buy_store_item บน Supabase เพื่อหักเงินและเพิ่มของแบบปลอดภัย 100%
            const { data, error } = await supabase.rpc('buy_store_item', {
                p_item_id: itemId
            });

            btnElement.disabled = false;
            btnElement.innerText = 'ซื้อสินค้า';

            if (error) {
                showModal('ข้อผิดพลาด', error.message);
                return;
            }

            if (data && data.success) {
                await updateWalletDisplay();
                showModal('ซื้อสำเร็จ', data.message);
            } else {
                showModal('แจ้งเตือน', data?.message || 'ไม่สามารถซื้อสินค้าได้');
            }
        }

        initAuth();
    </script>
</body>
</html>
