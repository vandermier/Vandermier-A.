<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - The Archons</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-right: 95px;
            white-space: nowrap;
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .archons-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .archon-card {
            background: #000;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            transition: border-color 0.2s;
        }

        .archon-card:hover {
            border-color: var(--accent);
        }

        .archon-card.rank-1 {
            border-color: #ffd700;
            background: linear-gradient(135deg, #000000 0%, #1a1600 100%);
        }

        .archon-badge {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: #ffd700;
            letter-spacing: 1px;
        }

        .avatar-md {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #222;
            flex-shrink: 0;
        }

        .archon-info {
            flex: 1;
            overflow: hidden;
        }

        .archon-title-tag {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .archon-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .archon-details {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Modal แจ้งเตือน */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">กลับหน้าหลัก</a>
            <h1 class="app-title">The Archons</h1>
        </div>

        <div class="section-box">
            <h3 class="box-title">Top 9 The Archons ประจำเดือน</h3>
            <p style="text-align: center; font-size: 11px; color: var(--text-muted); margin-bottom: 20px;">
                ขั้วอำนาจสูงสุด 9 อันดับแรกแห่งสถาบันแวนเดอร์เมียร์
            </p>
            <div class="archons-grid" id="archonsContainer">
                <p style="text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดข้อมูล The Archons...</p>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function fetchArchons() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('wins', { ascending: false })
                .limit(9);

            const container = document.getElementById('archonsContainer');

            if (error) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดข้อมูล The Archons ได้</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีข้อมูล The Archons ในขณะนี้</p>`;
                return;
            }

            container.innerHTML = data.map((user, index) => {
                const rankNum = index + 1;
                const shortName = user.name || 'Unknown';
                const fullName = user.full_name && user.full_name.trim() !== '' ? user.full_name : shortName;
                const avatar = user.avatar_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=V';
                const statusName = user.status || 'Novice-Celest';
                const winsCount = user.wins || 0;
                const isTop1 = rankNum === 1 ? 'rank-1' : '';

                return `
                    <div class="archon-card ${isTop1}">
                        <span class="archon-badge">#${rankNum}</span>
                        <img src="${avatar}" class="avatar-md" alt="Avatar">
                        <div class="archon-info">
                            <div class="archon-title-tag">The Archons : ${shortName}</div>
                            <div class="archon-name">${fullName}</div>
                            <div class="archon-details">สถานะ: ${statusName}<br>ชัยชนะ: ${winsCount.toLocaleString()} Wins</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchArchons();
    </script>
</body>
</html>
