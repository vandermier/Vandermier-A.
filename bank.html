<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .bank-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .bank-balance-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .bank-balance-amount {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .bank-acc-info {
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.3s;
            margin-top: 5px;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .contacts-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
        }

        .contact-info h4 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .contact-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .contact-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 10px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-transform: uppercase;
        }

        .btn-sm:hover {
            border-color: var(--accent);
        }

        .btn-sm.danger:hover {
            border-color: #ff4444;
            color: #ff4444;
        }

        /* Modal ดีไซน์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* สไตล์สลิปโอนเงิน */
        .slip-box {
            background: #0b0b0b;
            border: 1px solid var(--accent);
            padding: 20px;
            text-align: left;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .slip-header {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .slip-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .slip-label {
            color: var(--text-muted);
        }

        .slip-value {
            color: var(--text-main);
            font-weight: 500;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">← กลับหน้าหลัก</a>
            <h1 class="app-title">Bank</h1>
            <div style="width: 65px;"></div>
        </div>

        <!-- การ์ดแสดงยอดเงินและข้อมูลบัญชี -->
        <div class="bank-card">
            <p class="bank-balance-label">ยอดเงินคงเหลือ (Balance)</p>
            <h2 class="bank-balance-amount" id="displayBalance">0 Silver</h2>
            <div class="bank-acc-info">
                <p>ชื่อบัญชี: <span id="displayAccountName" style="color: var(--accent);">...</span></p>
                <p>เลขบัญชี: <span id="displayAccountNumber" style="color: var(--accent);">----------</span></p>
            </div>
        </div>

        <!-- ฟังก์ชันโอนเงิน (Transfer) -->
        <div class="section-box">
            <h3 class="box-title">โอนเงิน (Transfer)</h3>
            <form id="transferForm">
                <div class="form-group">
                    <label>เลขบัญชีผู้รับ (10 หลัก)</label>
                    <input type="text" id="transferAccount" maxlength="10" required placeholder="รหัสบัญชี 10 หลัก">
                </div>
                <div class="form-group">
                    <label>จำนวนเงิน (Silver)</label>
                    <input type="number" id="transferAmount" min="1" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>หมายเหตุ (Note - ถ้ามี)</label>
                    <textarea id="transferNote" placeholder="ระบุบันทึกช่วยจำ..."></textarea>
                </div>
                <button type="submit" class="btn-action">ยืนยันการโอนเงิน</button>
            </form>
        </div>

        <!-- ฟังก์ชันบันทึกรายชื่อ (Bank Contacts) -->
        <div class="section-box">
            <h3 class="box-title">สมุดบัญชีรายชื่อ (Contacts)</h3>
            <form id="contactForm" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label>ชื่อที่ต้องการบันทึกจำง่าย</label>
                    <input type="text" id="contactName" required placeholder="เช่น เพื่อนสนิท, ร้านค้า">
                </div>
                <div class="form-group">
                    <label>เลขบัญชีผู้รับ (10 หลัก)</label>
                    <input type="text" id="contactAccount" maxlength="10" required placeholder="10 หลัก">
                </div>
                <button type="submit" class="btn-action" style="background: transparent; border: 1px solid var(--accent); color: var(--accent);">บันทึกรายชื่อ</button>
            </form>

            <div class="contacts-list" id="contactsListContainer">
                <p style="text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดรายชื่อ...</p>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <!-- Modal แสดงสลิปการโอนเงิน -->
    <div class="modal-overlay" id="slipModal">
        <div class="modal-box" style="max-width: 400px;">
            <h3 class="modal-title">โอนเงินสำเร็จ</h3>
            <div class="slip-box" id="slipContent">
                <!-- เนื้อหาสลิปจะถูกเรนเดอร์ตรงนี้ -->
            </div>
            <button class="modal-btn" onclick="closeSlipModal()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let currentUser = null;
        let userData = null;

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        window.closeSlipModal = function() {
            document.getElementById('slipModal').classList.remove('active');
            location.reload(); // รีโหลดหน้าเพื่ออัปเดตยอดเงิน
        }

        async function initBank() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            // ดึงข้อมูลโปรไฟล์ผู้ใช้ปัจจุบัน
            let { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();

            if (!data) {
                window.location.href = 'profile.html'; // ถ้ายังไม่มีโปรไฟล์ให้ไปสร้างก่อน
                return;
            }

            userData = data;
            renderBankInfo();
            fetchContacts();
        }

        function renderBankInfo() {
            document.getElementById('displayBalance').innerText = `${Number(userData.silver || 0).toLocaleString()} Silver`;
            document.getElementById('displayAccountName').innerText = userData.bank_name || userData.name;
            document.getElementById('displayAccountNumber').innerText = userData.account_number;
        }

        // --- ระบบโอนเงิน ---
        document.getElementById('transferForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const receiverAccount = document.getElementById('transferAccount').value.trim();
            const amount = Number(document.getElementById('transferAmount').value);
            const note = document.getElementById('transferNote').value.trim();

            if (receiverAccount === userData.account_number) {
                showModal('ข้อผิดพลาด', 'ไม่สามารถโอนเงินให้บัญชีตนเองได้');
                return;
            }

            if (amount <= 0) {
                showModal('ข้อผิดพลาด', 'จำนวนเงินต้องมากกว่า 0');
                return;
            }

            if (Number(userData.silver || 0) < amount) {
                showModal('เงินไม่พอ', 'ยอดเงินในบัญชีของคุณไม่เพียงพอสำหรับการโอน');
                return;
            }

            // 1. ตรวจสอบว่าบัญชีผู้รับมีอยู่จริงไหม
            const { data: receiverData, error: receiverError } = await supabase
                .from('profiles')
                .select('*')
                .eq('account_number', receiverAccount)
                .maybeSingle();

            if (!receiverData || receiverError) {
                showModal('ไม่พบผู้รับ', 'ไม่พบเลขบัญชีผู้รับปลายทางในระบบ กรุณาตรวจสอบอีกครั้ง');
                return;
            }

            // 2. หักเงินผู้โอน และเพิ่มเงินให้ผู้รับ
            const newSenderSilver = Number(userData.silver) - amount;
            const newReceiverSilver = Number(receiverData.silver || 0) + amount;

            // อัปเดตเงินผู้โอน
            const { error: updateSenderError } = await supabase
                .from('profiles')
                .update({ silver: newSenderSilver })
                .eq('id', currentUser.id);

            if (updateSenderError) {
                showModal('เกิดข้อผิดพลาด', updateSenderError.message);
                return;
            }

            // อัปเดตเงินผู้รับ
            await supabase
                .from('profiles')
                .update({ silver: newReceiverSilver })
                .eq('id', receiverData.id);

            // 3. บันทึกประวัติลงตาราง transactions
            const senderName = userData.bank_name || userData.name;
            const receiverName = receiverData.bank_name || receiverData.name;

            await supabase.from('transactions').insert([{
                sender_id: currentUser.id,
                sender_account: userData.account_number,
                sender_name: senderName,
                receiver_account: receiverData.account_number,
                receiver_name: receiverName,
                amount: amount,
                note: note
            }]);

            // 4. แสดงสลิป
            showSlip({
                date: new Date().toISOString().replace('T', ' ').substring(0, 19),
                senderName: senderName,
                senderAcc: userData.account_number,
                receiverName: receiverName,
                receiverAcc: receiverData.account_number,
                amount: amount,
                note: note
            });
        });

        function showSlip(data) {
            const slipHtml = `
                <div class="slip-header">Vandermier A. Bank</div>
                <div class="slip-row"><span class="slip-label">วัน/เวลา:</span><span class="slip-value">${data.date}</span></div>
                <div class="slip-row"><span class="slip-label">ผู้โอน:</span><span class="slip-value">${data.senderName}</span></div>
                <div class="slip-row"><span class="slip-label">เลขบัญชีโอน:</span><span class="slip-value">${data.senderAcc}</span></div>
                <div class="slip-row"><span class="slip-label">ผู้รับ:</span><span class="slip-value">${data.receiverName}</span></div>
                <div class="slip-row"><span class="slip-label">เลขบัญชีรับ:</span><span class="slip-value">${data.receiverAcc}</span></div>
                <div class="slip-row" style="border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 8px;">
                    <span class="slip-label" style="font-weight:700; color:var(--accent);">จำนวนเงิน:</span>
                    <span class="slip-value" style="font-size:14px; font-weight:700; color:var(--accent);">${data.amount.toLocaleString()} Silver</span>
                </div>
                ${data.note ? `<div class="slip-row"><span class="slip-label">หมายเหตุ:</span><span class="slip-value">${data.note}</span></div>` : ''}
            `;
            document.getElementById('slipContent').innerHTML = slipHtml;
            document.getElementById('slipModal').classList.add('active');
        }

        // --- ระบบสมุดบัญชีรายชื่อ (Contacts) ---
        async function fetchContacts() {
            const { data, error } = await supabase
                .from('bank_contacts')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            const container = document.getElementById('contactsListContainer');
            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีรายชื่อที่บันทึกไว้</p>`;
                return;
            }

            container.innerHTML = data.map(c => `
                <div class="contact-item">
                    <div class="contact-info">
                        <h4>${c.contact_name}</h4>
                        <p>เลขบัญชี: ${c.contact_account}</p>
                    </div>
                    <div class="contact-actions">
                        <button class="btn-sm" onclick="selectContact('${c.contact_account}')">โอน</button>
                        <button class="btn-sm danger" onclick="deleteContact('${c.id}')">ลบ</button>
                    </div>
                </div>
            `).join('');
        }

        window.selectContact = function(accNum) {
            document.getElementById('transferAccount').value = accNum;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contactName = document.getElementById('contactName').value.trim();
            const contactAccount = document.getElementById('contactAccount').value.trim();

            if (contactAccount.length !== 10) {
                showModal('ข้อผิดพลาด', 'กรุณากรอกเลขบัญชีผู้รับให้ครบ 10 หลัก');
                return;
            }

            const { error } = await supabase.from('bank_contacts').insert([{
                user_id: currentUser.id,
                contact_name: contactName,
                contact_account: contactAccount
            }]);

            if (error) {
                showModal('เกิดข้อผิดพลาด', error.message);
            } else {
                document.getElementById('contactName').value = '';
                document.getElementById('contactAccount').value = '';
                fetchContacts();
            }
        });

        window.deleteContact = async function(id) {
            const { error } = await supabase.from('bank_contacts').delete().eq('id', id);
            if (!error) {
                fetchContacts();
            }
        }

        initBank();
    </script>
</body>
</html>
