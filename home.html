<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - หน้าหลัก</title>
    <!-- นำเข้า Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
            --admin-border: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* ส่วนหัวข้อแอป */
        .app-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* การ์ดโปรไฟล์ด้านบน */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background-color: #222;
        }

        .profile-info h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* หมวดหมู่แอป (APPS) */
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .app-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .app-item:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .app-item.admin-app {
            border-color: #551111;
            display: none; /* ซ่อนไว้ก่อน จะเปิดเฉพาะแอดมิน */
        }
        
        .app-item.admin-app:hover {
            border-color: var(--admin-border);
        }

        .app-icon {
            font-size: 24px;
        }

        .app-name {
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* Modal Popup นำเข้าสไตล์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="app-header">Vandermier A.</h1>

        <!-- การ์ดโปรไฟล์ด้านบน -->
        <div class="profile-card">
            <div class="profile-left">
                <img id="userAvatar" src="https://via.placeholder.com/150/000000/FFFFFF?text=V" alt="Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h3 id="userName">Loading...</h3>
                    <p id="userRank">แรงค์: ...</p>
                    <p id="userId">ID: ........</p>
                </div>
            </div>
            <button class="btn-logout" id="logoutBtn">ออกจากระบบ</button>
        </div>

        <p class="section-title">เมนูหลัก (APPS)</p>

        <!-- ตารางไอคอนแอปต่างๆ -->
        <div class="apps-grid">
            <a href="profile.html" class="app-item">
                <div class="app-icon">👤</div>
                <div class="app-name">Profile</div>
            </a>
            <a href="bank.html" class="app-item">
                <div class="app-icon">🏦</div>
                <div class="app-name">Bank</div>
            </a>
            <a href="friendship.html" class="app-item">
                <div class="app-icon">💬</div>
                <div class="app-name">Friendship</div>
            </a>
            <a href="leaderboard.html" class="app-item">
                <div class="app-icon">🏆</div>
                <div class="app-name">Leaderboard</div>
            </a>
            <a href="thearchons.html" class="app-item">
                <div class="app-icon">👑</div>
                <div class="app-name">The Archons</div>
            </a>
            <a href="store.html" class="app-item">
                <div class="app-icon">🛒</div>
                <div class="app-name">Store</div>
            </a>
            <a href="inventory.html" class="app-item">
                <div class="app-icon">🎒</div>
                <div class="app-name">Inventory</div>
            </a>
            <!-- เมนูแอดมิน ซ่อนไว้หากไม่ใช่แอดมิน -->
            <a href="admin.html" class="app-item admin-app" id="adminMenu">
                <div class="app-icon" style="color: #ff3333;">⚡</div>
                <div class="app-name" style="color: #ff3333;">Admin</div>
            </a>
        </div>
    </div>

    <!-- Popup Notification Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <!-- เรียกใช้ Supabase Config -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        const userNameEl = document.getElementById('userName');
        const userRankEl = document.getElementById('userRank');
        const userIdEl = document.getElementById('userId');
        const userAvatarEl = document.getElementById('userAvatar');
        const adminMenu = document.getElementById('adminMenu');
        const logoutBtn = document.getElementById('logoutBtn');

        // ฟังก์ชันแสดงป๊อปอัพสุดเท่
        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        // โหลดข้อมูลผู้ใช้จาก Supabase
        async function loadUserData() {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            
            if (!session || sessionError) {
                window.location.href = 'index.html';
                return;
            }

            const user = session.user;

            // ดึงข้อมูลจากตาราง profiles
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                userNameEl.innerText = profile.name;
                userRankEl.innerText = `แรงค์: ${profile.rank_name || 'Novice'}`;
                userIdEl.innerText = `ID: ${profile.custom_id}`;
                
                if (profile.avatar_url) {
                    userAvatarEl.src = profile.avatar_url;
                }

                // เช็คว่าเป็นแอดมินหรือไม่
                if (profile.role === 'admin' || user.email === 'adminzelisanya@gmail.com') {
                    adminMenu.style.display = 'flex';
                }
            } else {
                userNameEl.innerText = user.email.split('@')[0];
                userIdEl.innerText = 'ID: --------';
            }
        }

        loadUserData();

        // ฟังก์ชันออกจากระบบ
        logoutBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut();
            if (!error) {
                window.location.href = 'index.html';
            } else {
                showModal('ข้อผิดพลาด', 'ไม่สามารถออกจากระบบได้ กรุณาลองใหม่อีกครั้ง');
            }
        });
    </script>
</body>
</html>
