<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Inventory</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-right: 75px;
            white-space: nowrap;
        }

        .wallet-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .wallet-balance {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .store-card {
            background: #000;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .store-card:hover {
            border-color: var(--accent);
        }

        .item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #111;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.3;
            height: 28px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .item-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 8px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        /* Modal ดีไซน์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Navigation -->
        <div class="header-nav">
            <a href="home.html" class="btn-back">กลับหน้าหลัก</a>
            <h1 class="app-title">Inventory</h1>
        </div>

        <!-- Wallet Box -->
        <div class="wallet-box">
            <span class="wallet-label">ยอดเงินคงเหลือของคุณ</span>
            <span class="wallet-balance" id="userSilverBalance">0 Silver</span>
        </div>

        <!-- Main Section -->
        <div class="section-box">
            <h3 class="box-title">คลังเก็บของ</h3>
            <p style="font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 15px;">
                ไอเท็มประเภทอาหารและยาสามารถกดใช้งานเพื่อฟื้นฟูสเตตัส หรือส่งมอบให้เพื่อนได้
            </p>
            <div class="store-grid" id="inventory-grid">
                <p style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดคลังเก็บของ...</p>
            </div>
        </div>
    </div>

    <!-- Modal: Send Item to Friend -->
    <div class="modal-overlay" id="sendModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modal-item-title">ส่งไอเท็ม</h3>
            <p class="modal-message">เลือกเพื่อนที่ต้องการส่งไอเท็มนี้ให้ (ครั้งละ 1 ชิ้น)</p>
            <select id="friend-select">
                <option value="">กำลังโหลดรายชื่อเพื่อน...</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <button class="modal-btn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-main); flex: 1;" onclick="closeSendModal()">ยกเลิก</button>
                <button class="modal-btn" style="flex: 1;" id="confirm-send-btn" onclick="executeSendItem()">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script type="module">
        import { supabase } from './supabase-config.js';

        let currentUser = null;
        let userProfile = null;
        let inventoryItems = [];
        let selectedItemForSend = null;

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function initInventory() {
            const { data: { session }, error: authError } = await supabase.auth.getSession();
            if (authError || !session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            await fetchUserProfile();
            await fetchInventory();
        }

        async function fetchUserProfile() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            if (!error && data) {
                userProfile = data;
                document.getElementById('userSilverBalance').innerText = `${Number(data.silver || 0).toLocaleString()} Silver`;
            }
        }

        async function fetchInventory() {
            const grid = document.getElementById('inventory-grid');
            const { data, error } = await supabase
                .from('inventory')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = `<p style="grid-column: span 2; text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดข้อมูลคลังเก็บของได้</p>`;
                return;
            }

            inventoryItems = data || [];
            renderInventory();
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            if (inventoryItems.length === 0) {
                grid.innerHTML = `
                    <p style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--text-muted);">
                        คลังเก็บของว่างเปล่า สามารถไปเลือกซื้อสินค้าได้ที่ Store
                    </p>
                `;
                return;
            }

            grid.innerHTML = inventoryItems.map(item => `
                <div class="store-card">
                    <div>
                        <div style="position: relative;">
                            <img src="${item.image_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=Item'}" class="item-img" alt="Item">
                            <span style="position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); border: 1px solid var(--border-color); color: #fff; font-size: 10px; padding: 2px 6px;">x${item.quantity}</span>
                        </div>
                        <div class="item-name">${item.item_name}</div>
                        <div class="item-desc">${item.description || 'ไม่มีรายละเอียด'}</div>
                    </div>
                    <div class="item-footer">
                        <button class="btn-action" onclick="useItem('${item.id}')">ใช้ไอเท็ม</button>
                        <button class="btn-action btn-secondary" onclick="openSendModal('${item.id}')">ส่งให้เพื่อน</button>
                    </div>
                </div>
            `).join('');
        }

        window.useItem = async function(itemId) {
            await fetchUserProfile();
            const item = inventoryItems.find(i => i.id === itemId);
            if (!item) return;

            const name = item.item_name.toLowerCase();
            let statType = '';
            
            if (name.includes('น้ำยา') || name.includes('ยา') || name.includes('potion')) {
                if (userProfile.hp >= userProfile.hp_max) {
                    showModal('ไม่สามารถใช้งานได้', 'หลอดเลือด HP เต็มอยู่แล้ว!');
                    return;
                }
                statType = 'hp';
            } else if (name.includes('พลังงาน') || name.includes('energy') || name.includes('กาแฟ') || name.includes('ชา')) {
                if (userProfile.energy >= userProfile.energy_max) {
                    showModal('ไม่สามารถใช้งานได้', 'หลอดพลังงานเต็มอยู่แล้ว!');
                    return;
                }
                statType = 'energy';
            } else {
                if (userProfile.food >= userProfile.food_max) {
                    showModal('ไม่สามารถใช้งานได้', 'หลอดอาหารเต็มอยู่แล้ว ไม่สามารถกินเพิ่มได้!');
                    return;
                }
                statType = 'food';
            }

            let updateField = {};
            let healAmount = 25;
            if (statType === 'food') {
                let newFood = Math.min(userProfile.food_max, userProfile.food + healAmount);
                updateField = { food: newFood };
            } else if (statType === 'energy') {
                let newEnergy = Math.min(userProfile.energy_max, userProfile.energy + healAmount);
                updateField = { energy: newEnergy };
            } else if (statType === 'hp') {
                let newHp = Math.min(userProfile.hp_max, userProfile.hp + healAmount);
                updateField = { hp: newHp };
            }

            const { error: profileError } = await supabase
                .from('profiles')
                .update(updateField)
                .eq('id', currentUser.id);

            if (profileError) {
                showModal('เกิดข้อผิดพลาด', 'ไม่สามารถใช้ไอเท็มได้');
                return;
            }

            if (item.quantity > 1) {
                await supabase
                    .from('inventory')
                    .update({ quantity: item.quantity - 1 })
                    .eq('id', item.id);
            } else {
                await supabase
                    .from('inventory')
                    .delete()
                    .eq('id', item.id);
            }

            showModal('สำเร็จ', `ใช้งาน ${item.item_name} เรียบร้อยแล้ว!`);
            await fetchInventory();
        }

        window.openSendModal = async function(itemId) {
            selectedItemForSend = inventoryItems.find(i => i.id === itemId);
            if (!selectedItemForSend) return;

            document.getElementById('modal-item-title').innerText = `ส่งไอเท็ม: ${selectedItemForSend.item_name}`;
            
            const select = document.getElementById('friend-select');
            select.innerHTML = `<option value="">กำลังโหลดรายชื่อเพื่อน...</option>`;
            
            const { data, error } = await supabase
                .from('friends')
                .select('user_id, friend_id, status')
                .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`)
                .eq('status', 'accepted');

            if (error || !data || data.length === 0) {
                select.innerHTML = `<option value="">ไม่มีรายชื่อเพื่อนที่สามารถส่งของให้ได้</option>`;
                document.getElementById('sendModal').classList.add('active');
                return;
            }

            const friendIds = data.map(f => f.user_id === currentUser.id ? f.friend_id : f.user_id);
            const { data: profilesData } = await supabase
                .from('profiles')
                .select('id, name, custom_id')
                .in('id', friendIds);

            if (profilesData && profilesData.length > 0) {
                select.innerHTML = profilesData.map(f => `<option value="${f.id}">${f.name} (ID: ${f.custom_id})</option>`).join('');
            } else {
                select.innerHTML = `<option value="">ไม่พบเพื่อนในระบบ</option>`;
            }

            document.getElementById('sendModal').classList.add('active');
        }

        window.closeSendModal = function() {
            document.getElementById('sendModal').classList.remove('active');
            selectedItemForSend = null;
        }

        window.executeSendItem = async function() {
            const recipientId = document.getElementById('friend-select').value;
            if (!recipientId) {
                showModal('แจ้งเตือน', 'กรุณาเลือกเพื่อนที่ต้องการส่งไอเท็มให้');
                return;
            }
            if (!selectedItemForSend) return;

            const btn = document.getElementById('confirm-send-btn');
            btn.disabled = true;
            btn.innerText = 'กำลังส่ง...';

            if (selectedItemForSend.quantity > 1) {
                await supabase
                    .from('inventory.html' === '' ? '' : 'inventory') // เลี่ยงบั๊กเล็กน้อย
                    .update({ quantity: selectedItemForSend.quantity - 1 })
                    .eq('id', selectedItemForSend.id);
            } else {
                await supabase
                    .from('inventory')
                    .delete()
                    .eq('id', selectedItemForSend.id);
            }

            const { data: recipientItem } = await supabase
                .from('inventory')
                .select('*')
                .eq('user_id', recipientId)
                .eq('item_name', selectedItemForSend.item_name)
                .maybeSingle();

            if (recipientItem) {
                await supabase
                    .from('inventory')
                    .update({ quantity: Number(recipientItem.quantity) + 1 })
                    .eq('id', recipientItem.id);
            } else {
                await supabase
                    .from('inventory')
                    .insert([{
                        user_id: recipientId,
                        item_name: selectedItemForSend.item_name,
                        image_url: selectedItemForSend.image_url,
                        description: selectedItemForSend.description,
                        quantity: 1
                    }]);
            }

            btn.disabled = false;
            btn.innerText = 'ยืนยัน';
            closeSendModal();
            showModal('สำเร็จ', 'ส่งไอเท็มให้เพื่อนเรียบร้อยแล้ว!');
            await fetchInventory();
        }

        initInventory();
    </script>
</body>
</html>
