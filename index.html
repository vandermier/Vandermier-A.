<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - เข้าสู่ระบบ</title>
    <!-- นำเข้า Google Fonts (Cinzel และ Prompt ให้เข้ากับความเรียบหรูและโรลเพลย์) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #333333;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .brand-subtitle {
            font-size: 13px;
            text-align: center;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.3s, background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.85;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .toggle-mode span {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Modal Popup นำเข้าสไตล์หรูหรา */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="brand-title">Vandermier A.</h1>
        <p class="brand-subtitle">Academy of Shadows & Order</p>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="กรอกอีเมลของคุณ">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="กรอกรหัสผ่านของคุณ">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">เข้าสู่ระบบ</button>
        </form>

        <div class="toggle-mode">
            <p id="toggleText">ยังไม่มีบัญชีใช่หรือไม่? <span id="toggleBtn">สมัครสมาชิก</span></p>
        </div>
    </div>

    <!-- Popup Notification Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <!-- เรียกใช้ Supabase Config -->
    <script type="module">
        import { supabase } from './supabase-config.js'; // ปรับ path ตามไฟล์เชื่อมต่อ Supabase ของคุณ

        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleBtn = document.getElementById('toggleBtn');

        let isSignUpMode = false;

        // ฟังก์ชันแสดงป๊อปอัพสุดเท่
        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        // ตรวจสอบเซสชันค้างไว้ (ถ้าไม่ได้กด Log out ให้เข้า Home ทันที)
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        }
        checkSession();

        // สลับโหมดระหว่าง เข้าสู่ระบบ / สมัครสมาชิก
        toggleBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                submitBtn.innerText = 'สมัครสมาชิก';
                toggleText.innerHTML = 'มีบัญชีอยู่แล้ว? <span id="toggleBtn">เข้าสู่ระบบ</span>';
            } else {
                submitBtn.innerText = 'เข้าสู่ระบบ';
                toggleText.innerHTML = 'ยังไม่มีบัญชีใช่หรือไม่? <span id="toggleBtn">สมัครสมาชิก</span>';
            }
            // ผูก Event listener ใหม่ให้ปุ่มสลับโหมด
            document.getElementById('toggleBtn').addEventListener('click', arguments.callee);
        });

        // จัดการฟอร์ม Submit (Login / Sign Up)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังประมวลผล...';

            if (isSignUpMode) {
                // สมัครสมาชิก (ไม่มีการคอนเฟิร์มอีเมล สมัครปุ๊บเข้าได้เลย)
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    showModal('เกิดข้อผิดพลาด', error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'สมัครสมาชิก';
                } else {
                    showModal('สำเร็จ', 'สมัครสมาชิกสำเร็จ ยินดีต้อนรับสู่ Vandermier A.');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                }
            } else {
                // เข้าสู่ระบบปกติ
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showModal('เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'เข้าสู่ระบบ';
                } else {
                    showModal('ยินดีต้อนรับ', 'เข้าสู่ระบบสำเร็จ กำลังเข้าสู่สถาบัน...');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
