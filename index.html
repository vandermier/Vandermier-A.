<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - เข้าสู่ระบบ</title>
    
    <!-- PWA & Manifest Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vandermier">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-main: #f0f0f0;
            --text-muted: #777777;
            --border-color: #2a2a2a;
            --border-focus: #ffffff;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 45px;
            font-family: 'Cinzel', serif;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 0;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
            border-radius: 0;
        }

        input:focus {
            border-bottom-color: var(--border-focus);
        }

        input::placeholder {
            color: #333333;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .toggle-mode {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .toggle-mode span {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
            margin-left: 5px;
        }

        /* Modal Popup สไตล์หรูหราเข้ากัน */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #111111;
            border: 1px solid var(--border-color);
            padding: 35px 30px;
            width: 85%;
            max-width: 340px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 10px 28px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="brand-title">Vandermier A.</h1>
        <p class="brand-subtitle">Academy of Shadows & Order</p>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">เข้าสู่ระบบ</button>
        </form>

        <div class="toggle-mode" id="toggleContainer">
            <span id="toggleTextMsg">ยังไม่มีบัญชีใช่หรือไม่?</span> <span id="toggleBtn">สมัครสมาชิก</span>
        </div>
    </div>

    <!-- Popup Notification Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const toggleContainer = document.getElementById('toggleContainer');
        const toggleTextMsg = document.getElementById('toggleTextMsg');
        const toggleBtn = document.getElementById('toggleBtn');

        let isSignUpMode = false;

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        }
        checkSession();

        // ฟังก์ชันสลับโหมดที่แก้ไขให้กดสลับกลับไปมาได้สมบูรณ์
        toggleContainer.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'toggleBtn') {
                isSignUpMode = !isSignUpMode;
                if (isSignUpMode) {
                    submitBtn.innerText = 'สมัครสมาชิก';
                    toggleTextMsg.innerText = 'มีบัญชีอยู่แล้ว?';
                    toggleBtn.innerText = 'เข้าสู่ระบบ';
                } else {
                    submitBtn.innerText = 'เข้าสู่ระบบ';
                    toggleTextMsg.innerText = 'ยังไม่มีบัญชีใช่หรือไม่?';
                    toggleBtn.innerText = 'สมัครสมาชิก';
                }
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังประมวลผล...';

            if (isSignUpMode) {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    showModal('เกิดข้อผิดพลาด', error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'สมัครสมาชิก';
                } else {
                    showModal('สำเร็จ', 'สมัครสมาชิกสำเร็จ ยินดีต้อนรับสู่ Vandermier A.');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showModal('เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'เข้าสู่ระบบ';
                } else {
                    showModal('ยินดีต้อนรับ', 'เข้าสู่ระบบสำเร็จ กำลังเข้าสู่สถาบัน...');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
