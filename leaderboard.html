<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            transition: border-color 0.2s;
        }

        .rank-item:hover {
            border-color: var(--accent);
        }

        .rank-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            width: 25px;
            text-align: center;
        }

        /* เน้นย้ำอันดับ 1 - 3 ให้ดูโดดเด่นหรูหรา */
        .rank-item:nth-child(1) .rank-number { color: #ffd700; }
        .rank-item:nth-child(2) .rank-number { color: #c0c0c0; }
        .rank-item:nth-child(3) .rank-number { color: #cd7f32; }

        .avatar-sm {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #222;
        }

        .user-info h4 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .user-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .rank-wins {
            text-align: right;
        }

        .wins-count {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        .wins-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Modal แจ้งเตือน */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .modal-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">← กลับหน้าหลัก</a>
            <h1 class="app-title">Leaderboard</h1>
            <div style="width: 65px;"></div>
        </div>

        <div class="section-box">
            <h3 class="box-title">ตารางจัดอันดับชัยชนะ</h3>
            <div class="leaderboard-list" id="leaderboardContainer">
                <p style="text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดข้อมูลการจัดอันดับ...</p>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนทั่วไป -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">แจ้งเตือน</h3>
            <p class="modal-message" id="modalMessage">ข้อความแจ้งเตือน...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        window.showModal = function(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function fetchLeaderboard() {
            // ดึงข้อมูลผู้เล่นทั้งหมดเรียงตามจำนวนชัยชนะ (wins) จากมากไปน้อย
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('wins', { ascending: false });

            const container = document.getElementById('leaderboardContainer');

            if (error) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดข้อมูลอันดับได้</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีข้อมูลผู้เล่นในระบบ</p>`;
                return;
            }

            container.innerHTML = data.map((user, index) => {
                const rankNum = index + 1;
                const displayName = user.full_name && user.full_name.trim() !== '' ? user.full_name : user.name;
                const avatar = user.avatar_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=V';
                const rankName = user.rank_name || 'Novice';
                const winsCount = user.wins || 0;

                return `
                    <div class="rank-item">
                        <div class="rank-left">
                            <span class="rank-number">#${rankNum}</span>
                            <img src="${avatar}" class="avatar-sm" alt="Avatar">
                            <div class="user-info">
                                <h4>${displayName}</h4>
                                <p>แรงค์: ${rankName} | สถานะ: ${user.status || 'Novice-Celest'}</p>
                            </div>
                        </div>
                        <div class="rank-wins">
                            <div class="wins-count">${winsCount.toLocaleString()}</div>
                            <div class="wins-label">wins</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        fetchLeaderboard();
    </script>
</body>
</html>
