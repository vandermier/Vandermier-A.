<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandermier A. - Leaderboard</title>
    
    <!-- PWA & Manifest Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vandermier">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .app-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-right: 95px;
        }

        /* กล่องแสดงสถานะผู้เล่นปัจจุบัน */
        .user-status-box {
            background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%);
            border: 1px solid var(--accent);
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .user-status-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #ffd700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .user-status-desc {
            font-size: 12px;
            color: var(--text-main);
            line-height: 1.5;
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .rank-item:hover {
            border-color: var(--accent);
        }

        .rank-item.is-me {
            border-color: #ffd700;
        }

        .rank-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            width: 25px;
            text-align: center;
        }

        .rank-item:nth-child(1) .rank-number { color: #ffd700; }
        .rank-item:nth-child(2) .rank-number { color: #c0c0c0; }
        .rank-item:nth-child(3) .rank-number { color: #cd7f32; }

        .avatar-sm {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #222;
        }

        .user-info h4 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .user-info p {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .rank-wins {
            text-align: right;
        }

        .wins-count {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        .wins-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            margin: 0 auto 12px auto;
            background: #222;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--accent);
        }

        .modal-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .profile-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: left;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-val {
            color: var(--text-main);
            font-weight: 500;
        }

        .modal-btn {
            margin-top: 20px;
            padding: 8px 24px;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="home.html" class="btn-back">กลับหน้าหลัก</a>
            <h1 class="app-title">Leaderboard</h1>
        </div>

        <!-- กล่องวิเคราะห์สถานะของผู้เล่นที่ล็อกอินอยู่ -->
        <div class="user-status-box" id="userStatusBox">
            <div class="user-status-title">สถานะการแข่งขันของคุณ</div>
            <div class="user-status-desc" id="userStatusDesc">กำลังคำนวณอันดับของคุณ...</div>
        </div>

        <div class="section-box">
            <h3 class="box-title">ตารางจัดอันดับชัยชนะ (Real-time)</h3>
            <div class="leaderboard-list" id="leaderboardContainer">
                <p style="text-align: center; font-size: 12px; color: var(--text-muted);">กำลังโหลดข้อมูลการจัดอันดับ...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <img id="mAvatar" src="" class="modal-avatar" alt="Avatar">
            <h3 class="modal-title" id="mName">ชื่อผู้เล่น</h3>
            <p class="modal-subtitle" id="mFullName">ชื่อเต็ม</p>
            
            <div style="margin-bottom: 15px;">
                <div class="profile-info-row">
                    <span class="info-label">ID ประจำตัว</span>
                    <span class="info-val" id="mCustomId">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">สถานะ</span>
                    <span class="info-val" id="mStatus">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">แรงค์</span>
                    <span class="info-val" id="mRank">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">ชัยชนะ</span>
                    <span class="info-val" id="mWins">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">หอพัก</span>
                    <span class="info-val" id="mDorm">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">ชมรม</span>
                    <span class="info-val" id="mClub">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="info-label">วันเกิด</span>
                    <span class="info-val" id="mBirthday">-</span>
                </div>
            </div>

            <button class="modal-btn" onclick="closeProfileModal()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let allProfiles = [];
        let currentUserId = null;

        window.closeProfileModal = function() {
            document.getElementById('profileModal').classList.remove('active');
        }

        window.openProfileModal = function(userId) {
            const user = allProfiles.find(p => p.id === userId);
            if (!user) return;

            document.getElementById('mAvatar').src = user.avatar_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=V';
            document.getElementById('mName').innerText = user.name || 'Unknown';
            document.getElementById('mFullName').innerText = user.full_name || 'New Student';
            document.getElementById('mCustomId').innerText = user.custom_id || '-';
            document.getElementById('mStatus').innerText = user.status || 'Novice-Celest';
            document.getElementById('mRank').innerText = user.rank_name || 'Novice';
            document.getElementById('mWins').innerText = `${(user.wins || 0).toLocaleString()} ครั้ง`;
            document.getElementById('mDorm').innerText = user.dorm || 'หอพักทานตะวัน';
            document.getElementById('mClub').innerText = user.club_name || 'ไม่มีชมรม';
            document.getElementById('mBirthday').innerText = user.birthday || 'ไม่ระบุ';

            document.getElementById('profileModal').classList.add('active');
        }

        async function fetchLeaderboard() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUserId = session.user.id;
            }

            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('wins', { ascending: false });

            const container = document.getElementById('leaderboardContainer');
            const statusDesc = document.getElementById('userStatusDesc');

            if (error) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: #ff4444;">ไม่สามารถโหลดข้อมูลอันดับได้</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 12px; color: var(--text-muted);">ยังไม่มีข้อมูลผู้เล่นในระบบ</p>`;
                return;
            }

            allProfiles = data;

            let myIndex = data.findIndex(p => p.id === currentUserId);
            if (myIndex !== -1) {
                let myRank = myIndex + 1;
                let myWins = data[myIndex].wins || 0;

                if (myRank <= 9) {
                    statusDesc.innerHTML = `ยินดีด้วย! คุณอยู่อันดับที่ <b>#${myRank}</b> อยู่ในโซน <b>The Archons</b> ปลอดภัยแล้ว!`;
                } else {
                    let targetWins = data[8].wins || 0;
                    let neededWins = (targetWins - myWins) + 1;
                    statusDesc.innerHTML = `คุณอยู่อันดับที่ <b>#${myRank}</b> (${myWins} Wins)<br>ต้องการชัยชนะเพิ่มอีก <span style="color: #ffd700; font-weight: bold;">${neededWins} Wins</span> เพื่อแซงเข้าสู่ Top 9 ก่อนวันตัดรอบวันที่ 25!`;
                }
            } else {
                statusDesc.innerText = `ยังไม่พบข้อมูลการจัดอันดับของคุณ`;
            }

            container.innerHTML = data.map((user, index) => {
                const rankNum = index + 1;
                const displayName = user.full_name && user.full_name.trim() !== '' ? user.full_name : user.name;
                const avatar = user.avatar_url || 'https://via.placeholder.com/150/000000/FFFFFF?text=V';
                const rankName = user.rank_name || 'Novice';
                const statusName = user.status || 'Novice-Celest';
                const winsCount = user.wins || 0;
                const isMeClass = user.id === currentUserId ? 'is-me' : '';

                return `
                    <div class="rank-item ${isMeClass}" onclick="openProfileModal('${user.id}')">
                        <div class="rank-left">
                            <span class="rank-number">#${rankNum}</span>
                            <img src="${avatar}" class="avatar-sm" alt="Avatar">
                            <div class="user-info">
                                <h4>${displayName} ${user.id === currentUserId ? '(คุณ)' : ''}</h4>
                                <p>สถานะ: ${statusName}<br>แรงค์: ${rankName}</p>
                            </div>
                        </div>
                        <div class="rank-wins">
                            <div class="wins-count">${winsCount.toLocaleString()}</div>
                            <div class="wins-label">wins</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchLeaderboard();
    </script>
</body>
</html>
